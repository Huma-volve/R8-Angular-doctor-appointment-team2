<section id="contact">
  <div class="container mx-auto row py-5">
    <div class="info col-12 col-md-4">
      <div class="main">
        <h2>Contact Us</h2>
        <p>
          We are committed to processing the information in order to contact you and talk about your
          questions
        </p>
      </div>
      <div class="contact-tool gap-2">
        <div class="phone d-flex align-items-center gap-2 mb-3">
          <div class="icon"><i class="fa-solid fa-phone-volume fs-6"></i></div>
          <a href="#" target="_blank" class="link">080 707 555-321</a>
        </div>
        <div class="gmail d-flex align-items-center gap-2 mb-3">
          <div class="icon"><i class="fa-regular fa-envelope fs-6"></i></div>
          <a href="#" target="_blank" class="link">demo@example.com</a>
        </div>
        <div class="loction d-flex align-items-center gap-2 mb-3">
          <div class="icon"><i class="fa-solid fa-location-dot fs-6"></i></div>
          <a href="#" target="_blank" class="link"
            >526 Melrose Street, Water Mill, 11976 New York</a
          >
        </div>
      </div>
    </div>
    <div class="col-md-3"></div>
    <div class="form-to-contact mt-4 mt-md-0 col-12 col-md-5">
      <div class="container-md mx-md-auto">
        <form>
          <div class="mb-3">
            <input type="text" class="form-control rounded-3" placeholder="Name" />
          </div>
          <div class="mb-3">
            <input type="email" class="form-control rounded-3" placeholder="Email" />
          </div>
          <div class="mb-3">
            <textarea class="form-control rounded-3" rows="5" placeholder="Message"></textarea>
          </div>

          <button type="submit" class="btn w-100">Submit</button>
        </form>
      </div>
    </div>
  </div>
</section>
