<nav class="navbar">

  <div class="navbar-left">
    <img src="assets/BsHeartPulse.png" class="logo" />
  </div>

  <div class="navbar-center">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input placeholder="Search about specialty, doctor" />
  </div>

  <div class="navbar-right">

    <button type="button" class="icon-btn">
      <i class="fa-solid fa-bars"></i>
    </button>

    <button type="button" class="icon-btn" (click)="goToNotifications()">
      <i class="fa-regular fa-bell"></i>
    </button>

    <!-- PROFILE BUTTON -->
    <button
      type="button"
      class="profile-btn"
      (click)="openProfile()">
      <img src="assets/profile.jpg" alt="profile">
    </button>

  </div>
</nav>

<!-- POPUP (OUTSIDE NAV) -->
<app-profile-popup
  *ngIf="showProfile"
  (close)="closeProfile()">
</app-profile-popup>
